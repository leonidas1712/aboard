# How Aboard works with Codex. Schema: spec/harness-profile.schema.json.
harness: codex
name: Codex
drives: real
command: codex
check_name: codex

checks:
  installed:
    run: [codex, --version]
  logged_in:
    run: [codex, login, status]

sandbox_env: [CODEX_SANDBOX, CODEX_SANDBOX_NETWORK_DISABLED]
sandbox_network_env: [CODEX_SANDBOX_NETWORK_DISABLED]
sandbox_fix: trust Aboard's hooks in Codex (/hooks)
session_env: [CODEX_THREAD_ID]

# Codex reads its global config, hooks and rules from CODEX_HOME when it is set. Its
# skills for every project stay in ~/.agents/skills, which CODEX_HOME doesn't move.
config_dir:
  env: CODEX_HOME
  default: .codex

# Codex finds skills in the project's .agents/skills, and reads the project's .codex
# folder (hooks.json, rules/) only once the person trusts the project.
install:
  - kind: skill
    global: .agents/skills/aboard/SKILL.md
    project: .agents/skills/aboard/SKILL.md
  # Codex runs hooks only once trusted; with them in both scopes it runs each one twice.
  - kind: hooks
    format: json
    global: "{config_dir}/hooks.json"
    project: .codex/hooks.json
    missing:
      level: warning
      effect: so your messages wait for the end of a turn
  # A rules file in the rules folder next to each config layer, $CODEX_HOME or the
  # project's .codex. Codex runs a command every rule allows outside its sandbox.
  # Codex's sandbox blocks network access by default (CODEX_SANDBOX_NETWORK_DISABLED=1),
  # local addresses and Unix sockets included, so aboard needs this rule to reach its
  # server and daemon; the pattern matches only commands whose first word is aboard.
  - kind: allow-rule
    rule: prefix_rule(pattern=["aboard"], decision="allow")
    global: "{config_dir}/rules/aboard.rules"
    project: .codex/rules/aboard.rules
    note: Codex runs the commands it allows outside its sandbox.
    required:
      why: Codex's sandbox blocks network access; aboard needs to reach its local server. The rule lets Codex run aboard, and nothing else, outside its sandbox.
      advice: Codex's sandbox blocks network access, so aboard commands Codex runs can't reach the local server; add --allow-commands to let Codex run them outside its sandbox.
      missing: aboard commands not allowed, so Codex can't reach the local server
      allowed: aboard commands run outside Codex's sandbox
      not_allowed: no rule allows aboard commands, so Codex runs them in its sandbox, which blocks network access to the local Aboard server
  - kind: consent
    text: review them in /hooks
    project_text: Codex reads a project's .codex folder only once you trust the project.

interactive:
  start: [codex, "{prompt}"]

# Headless turns go through codex-acp, which starts Codex's own app server, so it runs
# the real Codex with the user's config, hooks and skills.
headless:
  via: acp

acp:
  command: [codex-acp]
  package: npm @agentclientprotocol/codex-acp
  env:
    CODEX_PATH: "{command_path}"
  drives: real

identity:
  session: Codex sets CODEX_THREAD_ID in the environment of every command the agent runs.
  launched: >-
    ABOARD_AGENT in the environment of the commands the agent runs. Codex's hooks don't
    see the environment Codex was started with, so hooks never rely on it.
  kind: env
  env: CODEX_THREAD_ID

lifecycle:
  liveness: process
  outlives_terminal: true
  resume_keeps_id: true
  resume_start: first-turn
  subagent_field: agent_id

delivery:
  method: queue
  capabilities: [queue, tool-boundary]
  queue: [codex, queue, --thread, "{session}", --message, "{bundle}"]
  hooks:
    - event: SessionStart
      run: session-start
      op: session-start
      timeout: 30
      why: registers the thread
    - event: UserPromptSubmit
      run: prompt
      op: prompt
      timeout: 10
      why: marks a turn running, so the owner's messages wait for a tool call instead of the queue
    - event: Stop
      run: stop
      op: turn-end
      timeout: 10
      why: confirms what the turn's tool calls received and marks the turn ended; the owner's messages no tool call took go into the queue
    # additionalContextLimit is in tokens: well above the 9,000 bytes the daemon adds at
    # one tool boundary, so Codex never shortens it.
    - event: PreToolUse
      run: tool
      op: tool
      timeout: 30
      options: {additionalContextLimit: 8192}
      why: before each tool call, adds the owner's messages and the waiting notice as additionalContext; never denies
    - event: SessionEnd
      run: end
      op: end
      timeout: 3
      why: closes the session (Codex allows 3 seconds); 0.159.3 was not seen to run it on quit or when its app server stopped
  mid_turn: tool-hook
  waiting_notice: true

notes:
  - The queue holds a bundle until the thread's current turn ends, so busy sessions need no tracking for ordinary messages.
  - Before binding, the daemon reads the exact thread through codex app-server (thread/read) and refuses sub-agent threads.
  - Hooks run only once trusted. Codex asks ("Hooks need review") when the first prompt is sent, or the person trusts them in /hooks; Codex asks again whenever a hook's command changes. Until then no hook runs, session start included; delivery still works through the queue but the owner's messages wait for the end of the turn.
  - Settings passed with -c, or --dangerously-bypass-hook-trust, make Codex run its own embedded app server, which codex queue can't reach.
  - A daemon started from inside Codex's sandbox inherits it and can't run codex app-server, so a sandboxed command never starts one.
  - "Verified with Codex 0.159.3 (codex exec -s workspace-write, network off as by default): without the allow rule, aboard status inside Codex reported the running server and daemon as not running; with rules/aboard.rules it reported both running. A command that gets no answer there now fails with sandbox_blocks_network."
  - "Verified live with Codex 0.159.3: idle wake through the queue, a message added at the next tool call, sub-agent refusal."
  - PreToolUse's additionalContext (Codex 0.129.0 and later) is recorded as a developer message before the tool runs. PostToolUse runs only after a tool succeeds, so it would miss failed tool calls; the tool hook is on PreToolUse.
  - Hook input carries session_id, turn_id and cwd, and agent_id and agent_type in a thread-spawned sub-agent; the tool hook ignores sub-agents.
  - "Verified live with Codex 0.159.3: codex resume <id> keeps the thread id (CODEX_THREAD_ID and the hooks' session_id), and SessionStart runs with source resume, but only once the resumed thread's first turn starts, not when the terminal opens. The session-start hook then binds it again to its agent (D157), and the waiting message goes into its queue."
  - "Verified live with Codex 0.159.3: Codex runs threads, and their hooks, in its own app server (codex app-server --managed-daemon, under CODEX_HOME), which outlives the terminal. The daemon therefore records that app server as the session's process. Quitting Codex prints \"Disconnected from this task. Any running work continues.\" and runs no SessionEnd; the thread stays loaded, so its session stays open, and a message posted afterwards was queued and answered with no terminal attached. The session closes when the app server stops (no SessionEnd ran then either; the daemon saw its process gone)."
