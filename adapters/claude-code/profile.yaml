# How Aboard works with Claude Code. Schema: spec/harness-profile.schema.json.
harness: claude-code
name: Claude Code
drives: real
command: claude
check_name: claude

checks:
  installed:
    run: [claude, --version]
  logged_in:
    run: [claude, auth, status]
    json_true: loggedIn
  # The first Claude Code whose session-start hook gets CLAUDE_ENV_FILE, which gives a
  # session's commands their identity (checked in the published builds). A version that
  # can't be read gets the hooks this one runs.
  min_version: 2.0.22

sandbox_env: [SANDBOX_RUNTIME]
sandbox_fix: install Aboard's hooks with aboard init
session_env: [ABOARD_SESSION, CLAUDECODE]

# Claude Code reads its global settings and skills from CLAUDE_CONFIG_DIR when it is set.
config_dir:
  env: CLAUDE_CONFIG_DIR
  default: .claude

# settings.local.json is the project file meant for one person's machine; the hooks name
# this machine's aboard binary.
install:
  - kind: skill
    global: "{config_dir}/skills/aboard/SKILL.md"
    project: .claude/skills/aboard/SKILL.md
  - kind: hooks
    format: json
    global: "{config_dir}/settings.json"
    project: .claude/settings.local.json
  # No paths: it goes in permissions.allow of the settings file that holds the hooks.
  # Claude Code also reads the older prefix form.
  - kind: allow-rule
    rule: Bash(aboard *)
    accepts: ["Bash(aboard:*)"]
  - kind: consent
    text: review them in /hooks

interactive:
  start: [claude, "{prompt}"]
  resume: [claude, --resume, "{session}", "{prompt}"]
  model: [--model, "{model}"]

# Claude Code's own non-interactive mode. Its ACP adapter runs the Claude Agent SDK, a
# different program with its own settings, plugins, hooks and auth; that is the separate
# harness claude-agent-sdk, never this one.
headless:
  via: native
  run: [claude, --print, --output-format, json, "{prompt}"]
  resume: [claude, --print, --output-format, json, --resume, "{session}", "{prompt}"]
  session_from: session_id in the JSON result
  session_field: session_id
  model: [--model, "{model}"]

identity:
  session: >-
    The session-start hook writes ABOARD_SESSION=claude-code:<session id> and
    ABOARD_BOOT to CLAUDE_ENV_FILE, so every command the agent runs carries them.
  launched: ABOARD_AGENT in the session's environment, which its hooks also see.
  kind: hook
  env_file: CLAUDE_ENV_FILE
  # omp sets CLAUDECODE=1 in every command too, and OMPCODE=1. A Codex started inside a
  # Claude Code session inherits ABOARD_SESSION, and CODEX_THREAD_ID is the more
  # specific marker; the session-start hook unsets an inherited CODEX_THREAD_ID.
  yields_to: [OMPCODE, CODEX_THREAD_ID]

# Hooks fired inside a subagent carry agent_id; the pre-tool hook marks a subagent's
# aboard commands with ABOARD_SUBAGENT, so they may only read.
subagent_identity: marked

lifecycle:
  liveness: process
  resume_keeps_id: true
  resume_start: at-open
  subagent_field: agent_id

delivery:
  method: stop-hook
  capabilities: [idle-hook, tool-boundary, turn-start]
  # Claude Code 1.0.23 to 2.1.100 ignore the whole settings file, the person's own
  # settings included, when it names one hook event they don't know; 2.1.101 and later
  # skip just that entry. So each hook carries the first version that runs it as
  # written, and aboard init writes only what the installed version runs. The versions
  # come from the hook event list and settings schema in each published build of
  # @anthropic-ai/claude-code on npm, and from its CHANGELOG.md.
  hooks:
    # SessionStart is known since 1.0.62; CLAUDE_ENV_FILE reaches its hooks since 2.0.22.
    - event: SessionStart
      run: session-start
      op: session-start
      timeout: 30
      since: 2.0.22
      why: registers the session and writes its environment file
      without: commands in a session can't tell which agent they are
    # Known since 1.0.53 (CHANGELOG: 1.0.54).
    - event: UserPromptSubmit
      run: prompt
      op: prompt
      timeout: 10
      since: 1.0.54
      why: marks the session busy, releases a waiting stop hook, and adds the messages that waited quietly for the turn as additionalContext
      without: a session isn't marked busy when you type
    # The hook waits for as long as the session is idle. Stop is known since 1.0.31, but
    # asyncRewake only since 2.1.64; an older version drops it and runs the hook in the
    # foreground, so the session would hang at the end of every turn.
    - event: Stop
      run: stop
      op: wait
      timeout: 86400
      options: {asyncRewake: true}
      since: 2.1.64
      why: "asyncRewake: waits while idle; exit 2 wakes the session with the bundle"
      without: an idle session doesn't wake for new messages
    # PostToolBatch since 2.1.118. PostToolUse is known since 1.0.23 and takes
    # additionalContext since 1.0.65; PostToolUseFailure is known since 2.0.56.
    - event: PostToolBatch
      run: tool
      op: tool
      timeout: 10
      since: 2.1.118
      fallback:
        - {event: PostToolUse, since: 1.0.65}
        - {event: PostToolUseFailure, since: 2.0.56}
      why: once a batch of tool calls is done, adds the owner's messages and the waiting notice as additionalContext
      without: your messages wait for the end of a turn
    # Only shell commands, and only inside a subagent; it never contacts the daemon.
    # PreToolUse is known since 1.0.23 and takes updatedInput since 2.0.10; hooks see
    # agent_id since 2.1.69 (CHANGELOG), without which the hook can't tell a subagent.
    - event: PreToolUse
      run: pre-tool
      op: mark-subagent
      matcher: Bash
      timeout: 10
      since: 2.1.69
      why: inside a subagent, prefixes an aboard command with export ABOARD_SUBAGENT=<agent_id> through updatedInput, so it can't act as the parent; never denies
      without: a subagent's aboard commands act as your agent
    # Known since 1.0.85.
    - event: SessionEnd
      run: end
      op: end
      timeout: 10
      since: 1.0.85
      why: closes the session
      without: a session you quit stays open until the daemon sees its process gone
  mid_turn: tool-hook
  waiting_notice: true

notes:
  - The wake's bundle comes back as the next UserPromptSubmit; that prompt is not a later event and doesn't confirm the bundle.
  - Hooks run with the environment Claude Code was started with.
  - A stop hook can reach the daemon after the next prompt if the user types quickly; waits carry their start time so a late one is released.
  - "Verified live with Claude Code 2.1.286: idle wake, a message added at the next tool call, bundling, redelivery after a killed session."
  - PostToolBatch first appears in Claude Code 2.1.118 (checked in the published builds); it fires once per batch of parallel tool calls, failed ones included, before the next model call. Older versions get the tool hook on PostToolUse and PostToolUseFailure instead.
  - Claude Code takes at most 10,000 characters of additionalContext from a hook; longer text goes to a file with a preview, so the daemon keeps a tool boundary's context under 9,000 bytes.
  - Hooks fired inside a subagent carry agent_id; the tool hook ignores them.
  - "PreToolUse's updatedInput replaces the tool's whole input, and without a permissionDecision Claude Code's permission rules still apply to it (documented for 2.1.288). An allow rule doesn't match past an assignment of a variable Claude Code doesn't know, so Bash(aboard *) doesn't pre-approve a marked command."
  - SubagentStart and SubagentStop hooks exist, with agent_id, agent_type and parent_agent_id; SubagentStop adds last_assistant_message and stop_reason. Aboard doesn't install them yet.
  - "claude --resume <id>, --continue and /resume keep the session id (2.1.288's --help: --fork-session is what gives a resumed session a new one), and SessionStart runs as the session opens, with source resume. The session-start hook registers the same id again, which binds it again to its agent (D157). No turn has run yet, so no stop hook waits: waiting messages arrive when the first turn ends. TestResumeReconnects/claude-code proves it live."
  - Quitting (Ctrl-C twice, /exit) runs SessionEnd, which closes the session; a killed one is closed when the daemon sees its process gone.
