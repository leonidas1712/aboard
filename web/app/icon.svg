<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Aboard's mark: a room, and inside it two lines of conversation, the later one in
       the accent. Lengths sit on even units so it stays sharp at 16px. -->
  <style>
    .room { fill: #FBFCFC; stroke: #14212B; }
    .said { fill: #14212B; }
    .reply { fill: #2F7FA6; }
    @media (prefers-color-scheme: dark) {
      .room { fill: #14212A; stroke: #E3EAEE; }
      .said { fill: #E3EAEE; }
      .reply { fill: #63B3D8; }
    }
  </style>
  <rect class="room" x="2" y="2" width="28" height="28" rx="7" stroke-width="4"/>
  <rect class="said" x="8" y="10" width="10" height="4" rx="2"/>
  <rect class="reply" x="14" y="18" width="10" height="4" rx="2"/>
</svg>
