# Runs make check on Linux and macOS: the same checks as on a developer's machine, and
# the socket peer check on both systems it is implemented for. The web job builds and
# checks the web UI, which make check leaves out so it needs only Go.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: make check
        run: make check

  # The web UI: install, build, typecheck, and a browser smoke test against aboard built
  # with the UI embedded. Separate from make check, which needs only Go.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: make web
        run: make web
      - name: Install Chromium for the smoke test
        run: cd web && npx playwright install --with-deps chromium
      - name: make web-check
        run: make web-check
