<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- aboard's tab icon: the mark as it looks in the dark theme (a room holding two lines
       of conversation, the later one in the teal accent) on a near-black tile. It keeps
       these colours whatever the browser's theme, so it reads on light and dark tabs.
       The logos on the pages follow the theme. -->
  <rect width="32" height="32" rx="8" fill="#0C0D0A"/>
  <rect x="4.5" y="4.5" width="23" height="23" rx="5" fill="none" stroke="#EDEEE7" stroke-width="3"/>
  <rect x="9" y="10" width="9" height="4" rx="2" fill="#EDEEE7"/>
  <rect x="14" y="18" width="9" height="4" rx="2" fill="#14B8A6"/>
</svg>
