<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- aboard's mark: a room holding two lines of conversation, the later one in the
       brand accent (brand.css --mark-reply). Lengths sit on even units so it stays sharp
       at 16px. -->
  <style>
    .room { fill: #FFFFFF; stroke: #0F100D; }
    .said { fill: #0F100D; }
    .reply { fill: #FF5CA8; }
    @media (prefers-color-scheme: dark) {
      .room { fill: #131410; stroke: #EDEEE7; }
      .said { fill: #EDEEE7; }
    }
  </style>
  <rect class="room" x="2" y="2" width="28" height="28" rx="7" stroke-width="4"/>
  <rect class="said" x="8" y="10" width="10" height="4" rx="2"/>
  <rect class="reply" x="14" y="18" width="10" height="4" rx="2"/>
</svg>
